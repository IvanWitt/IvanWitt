name: Build Maya Calendar v1.3.0 Mechanism

on:
  pull_request:
    branches:
      - feature/moon-calendar-start-date
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/calendar-mechanism-v2

      - name: Prepare v1.3.0 sources
        run: python3 tools/prepare_v130.py

      - name: Verify isolated calendar mechanism requirements
        shell: bash
        run: |
          set -euo pipefail
          JS=app/src/main/assets/calendar-mechanism-v2.js
          HTML=app/src/main/assets/index.html
          node --check "$JS"
          grep -q 'calendar-mechanism-v2.js' "$HTML"
          grep -q "buildStoneGear(el('tzGear'),52" "$JS"
          grep -q "buildStoneGear(el('haabGear'),73" "$JS"
          grep -q "buildStoneGear(el('moonGear'),73" "$JS"
          grep -q 'id="longRack"' "$JS"
          grep -q 'wood-pulley' "$JS"
          grep -q 'class="rope"' "$JS"
          grep -q 'class="vine"' "$JS"
          grep -q 'id="gearDate"' "$JS"
          grep -q 'id="gearCorrelation"' "$JS"
          grep -q 'value="584283"' "$JS"
          grep -q 'mechanism-gmt-badge">GMT' "$JS"
          grep -q 'id="gearStep"' "$JS"
          grep -q 'id="gearMinus20"' "$JS"
          grep -q 'id="gearMinus1"' "$JS"
          grep -q 'id="gearPlay"' "$JS"
          grep -q 'id="gearPlus1"' "$JS"
          grep -q 'id="gearPlus20"' "$JS"
          grep -q 'id="gearToday"' "$JS"
          grep -q 'id="gearSlider"' "$JS"
          grep -q 'mechanismTzolkin' "$JS"
          grep -q 'mechanismHaab' "$JS"
          grep -q 'mechanismMoon' "$JS"
          grep -q 'mechanismLongCount' "$JS"
          grep -q 'initGearControls=initMechanism' "$JS"
          grep -q 'updateGearCalendar=renderMechanism' "$JS"
          ! grep -q "getElementById('gregorianDate')" "$JS"
          ! grep -q "getElementById('correlation')" "$JS"
          ! grep -q 'updateAll()' "$JS"
          grep -q "versionName '1.3.0'" app/build.gradle
          grep -q 'versionCode 10' app/build.gradle

      - name: Verify gear ratios and calendar arithmetic
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import date
          assert 52*5 == 260
          assert 73*5 == 365
          def mod(n,m): return ((n%m)+m)%m
          def gregorian_to_jdn(y,m,d):
              a=(14-m)//12
              y2=y+4800-a
              m2=m+12*a-3
              return d+(153*m2+2)//5+365*y2+y2//4-y2//100+y2//400-32045
          corr=584283
          days=gregorian_to_jdn(2012,12,21)-corr
          tone=mod(days+3,13)+1
          sign=mod(days+19,20)
          kin=mod(days+159,260)+1
          hi=mod(days+348,365)
          assert (tone,sign,kin)==(4,19,160)
          assert hi==263
          ordinal=hi+1
          moon=(ordinal-1)//28+1
          moon_day=(ordinal-1)%28+1
          assert (ordinal,moon,moon_day)==(264,10,12)
          assert days==1872000
          print('Gear ratios and independent calendar arithmetic verified')
          PY

      - name: Verify previous moon-day modal remains intact
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/moon-calendar-v2.js
          node --check app/src/main/assets/moon-calendar-modal-fix.js
          grep -q 'moon-day-save' app/src/main/assets/moon-calendar-modal-fix.js
          grep -q 'syncEventsPageImmediately' app/src/main/assets/moon-calendar-modal-fix.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build full debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'calendar-mechanism-v2.js'
          unzip -p "$APK" assets/calendar-mechanism-v2.js | grep -q "buildStoneGear(el('tzGear'),52"
          unzip -p "$APK" assets/calendar-mechanism-v2.js | grep -q "buildStoneGear(el('haabGear'),73"
          unzip -p "$APK" assets/calendar-mechanism-v2.js | grep -q "buildStoneGear(el('moonGear'),73"
          unzip -p "$APK" assets/calendar-mechanism-v2.js | grep -q 'id="gearStep"'
          unzip -p "$APK" assets/calendar-mechanism-v2.js | grep -q 'mechanismLongCount'
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/MayaCalendar-v1.3.0-mechanism.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.3.0-mechanism
          path: /tmp/apk/MayaCalendar-v1.3.0-mechanism.apk
          if-no-files-found: error
