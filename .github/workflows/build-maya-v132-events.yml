name: Build Maya Calendar v1.3.2 Events

on:
  pull_request:
    branches:
      - feature/moon-calendar-start-date
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/calendar-mechanism-v2

      - name: Prepare v1.3.2 sources
        run: python3 tools/prepare_v132.py

      - name: Verify responsive events table requirements
        shell: bash
        run: |
          set -euo pipefail
          JS=app/src/main/assets/events-table-v2.js
          HTML=app/src/main/assets/index.html
          node --check "$JS"
          grep -q 'events-table-v2.js' "$HTML"
          grep -q "headers\[0\].textContent='День'" "$JS"
          grep -q "headers\[1\].textContent='Событие'" "$JS"
          grep -q "headers\[2\].textContent='Цвет'" "$JS"
          grep -q 'min-width:0!important;table-layout:fixed' "$JS"
          grep -q 'event-colored-row' "$JS"
          grep -q 'event-color-cell' "$JS"
          grep -q 'event-color-select' "$JS"
          grep -q 'opacity:0' "$JS"
          grep -q 'paintRow(tr,select.value)' "$JS"
          grep -q 'eventColors.forEach' "$JS"
          grep -q "versionName '1.3.2'" app/build.gradle
          grep -q 'versionCode 12' app/build.gradle

      - name: Verify previous mechanism and moon modal remain intact
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/calendar-mechanism-v3.js
          node --check app/src/main/assets/moon-calendar-v2.js
          node --check app/src/main/assets/moon-calendar-modal-fix.js
          grep -q "rotor:'tzRotor'" app/src/main/assets/calendar-mechanism-v3.js
          grep -q 'moon-day-save' app/src/main/assets/moon-calendar-modal-fix.js
          grep -q 'syncEventsPageImmediately' app/src/main/assets/moon-calendar-modal-fix.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build full debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'events-table-v2.js'
          unzip -p "$APK" assets/events-table-v2.js | grep -q "headers\[0\].textContent='День'"
          unzip -p "$APK" assets/events-table-v2.js | grep -q 'event-colored-row'
          unzip -p "$APK" assets/events-table-v2.js | grep -q 'opacity:0'
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/MayaCalendar-v1.3.2-events.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.3.2-events
          path: /tmp/apk/MayaCalendar-v1.3.2-events.apk
          if-no-files-found: error
