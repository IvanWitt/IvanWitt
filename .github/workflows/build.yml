name: Build Maya Calendar Final Clean

on:
  pull_request:
    branches:
      - maya-final-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact final sources
        run: |
          cat exactsrc/html0.b64 exactsrc/html1.b64 exactsrc/html2.b64 exactsrc/html3.b64 | tr -d '\n\r ' | base64 -d | gunzip > app/src/main/assets/index.html
          cat exactsrc/java.b64 | tr -d '\n\r ' | base64 -d | gunzip > app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          echo 'afc86548df83e13f65e14fd37efb4a15a8ef73751ea9438d6211afc78279572c  app/src/main/assets/index.html' | sha256sum -c -
          echo '90ca2a8458f2ef3bab4ab9bde6e2a6b1b8fad9d20464a91a5b45551acd1c7adb  app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java' | sha256sum -c -
      - name: Verify sharp splash source
        run: echo '9ea883fcd0e490b83a61b48a0377c1c14603ea76c7ce0d4829a797d49ae640bb  app/src/main/res/drawable-nodpi/splash_maya.webp' | sha256sum -c -
      - name: Verify HTML requirements
        run: |
          HTML=app/src/main/assets/index.html
          ! grep -q 'iwitt.ru' "$HTML"
          ! grep -q 'Автономный HTML' "$HTML"
          ! grep -q 'window.applyImportedEventsJson' "$HTML"
          grep -q 'receiveImportedEventsJson' "$HTML"
      - name: Verify Android requirements
        run: |
          JAVA=app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          grep -q 'ACTION_OPEN_DOCUMENT' "$JAVA"
          grep -q 'setDecorFitsSystemWindows(true)' "$JAVA"
          grep -q 'Календарь Майя v1.2' "$JAVA"
          grep -q 'Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL' "$JAVA"
          grep -q 'targetSdk 34' app/build.gradle
          grep -q "versionName '1.2'" app/build.gradle
      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text('utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(blocks),'utf-8')
          PY
          node --check /tmp/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html > /tmp/final-index.html
          echo 'afc86548df83e13f65e14fd37efb4a15a8ef73751ea9438d6211afc78279572c  /tmp/final-index.html' | sha256sum -c -
          ! grep -q 'iwitt.ru' /tmp/final-index.html
          ! grep -q 'Автономный HTML' /tmp/final-index.html
          grep -q 'receiveImportedEventsJson' /tmp/final-index.html
          unzip -l "$APK" | grep 'splash_maya'
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/MayaCalendar-v1.2-final.apk
          sha256sum /tmp/apk/MayaCalendar-v1.2-final.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.2-final-APK
          path: /tmp/apk/MayaCalendar-v1.2-final.apk
          if-no-files-found: error
