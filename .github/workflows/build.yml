name: Build Maya Calendar Final Clean

on:
  pull_request:
    branches:
      - maya-final-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify requirements
        run: |
          HTML=app/src/main/assets/index.html
          JAVA=app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          echo 'c40b642d0e4514a8a441515b2d7d8e45c6d708b8494c9806fecd8d1270d3126e  app/src/main/res/drawable-nodpi/splash_maya.webp' | sha256sum -c -
          ! grep -q 'iwitt.ru' "$HTML"
          ! grep -q 'Автономный HTML' "$HTML"
          ! grep -q 'window.applyImportedEventsJson' "$HTML"
          grep -q 'receiveImportedEventsJson' "$HTML"
          grep -q 'ACTION_OPEN_DOCUMENT' "$JAVA"
          grep -q 'setDecorFitsSystemWindows(true)' "$JAVA"
          grep -q 'Календарь Майя v1.2' "$JAVA"
          grep -q 'Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL' "$JAVA"
          grep -q 'targetSdk 34' app/build.gradle
          grep -q "versionName '1.2'" app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text('utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(blocks),'utf-8')
          PY
          node --check /tmp/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html > /tmp/final-index.html
          ! grep -q 'iwitt.ru' /tmp/final-index.html
          ! grep -q 'Автономный HTML' /tmp/final-index.html
          grep -q 'receiveImportedEventsJson' /tmp/final-index.html
          unzip -l "$APK" | grep 'splash_maya'
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/MayaCalendar-v1.2-final.apk
          sha256sum /tmp/apk/MayaCalendar-v1.2-final.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.2-final-APK
          path: /tmp/apk/MayaCalendar-v1.2-final.apk
          if-no-files-found: error
