name: Build Maya Calendar APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify HTML
        run: |
          mkdir -p maya-calendar-android/project/app/src/main/assets
          cat \
            maya-calendar-android/index-parts/00.b64 \
            maya-calendar-android/index-parts/01.b64 \
            maya-calendar-android/index-parts/02.b64 \
            maya-calendar-android/index-parts/03.b64 \
            maya-calendar-android/index-parts/04.b64 \
            maya-calendar-android/index-parts/05a.b64 \
            maya-calendar-android/index-parts/05b.b64 \
            maya-calendar-android/index-parts/06.b64 \
            maya-calendar-android/index-parts/07a.b64 \
            maya-calendar-android/index-parts/07b.b64 \
            maya-calendar-android/index-parts/08.b64 \
            maya-calendar-android/index-parts/09.b64 \
            | tr -d '\n\r ' | base64 -d > maya-calendar-android/project/app/src/main/assets/index.html
          echo "c337a8c7d5e084c956dd6d5626d88b4b9a2c5f4f11986869c21e2b05aae0c9c6  maya-calendar-android/project/app/src/main/assets/index.html" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: maya-calendar-android/project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk
          cp maya-calendar-android/project/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/MayaCalendar.apk
          sha256sum /tmp/apk/MayaCalendar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-APK
          path: /tmp/apk/MayaCalendar.apk
          if-no-files-found: error
          retention-days: 30
