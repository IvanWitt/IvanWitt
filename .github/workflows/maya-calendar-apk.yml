name: Build Maya Calendar APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify updated HTML
        run: |
          mkdir -p maya-calendar-android/project/app/src/main/assets
          cat maya-calendar-android/v4/00.b64 maya-calendar-android/v4/01.b64 maya-calendar-android/v4/02.b64 maya-calendar-android/v4/03.b64 maya-calendar-android/v4/04.b64 maya-calendar-android/v4/05.b64 | tr -d '\n\r ' | base64 -d | gunzip > maya-calendar-android/project/app/src/main/assets/index.html
          echo "a5b01698abe380e339525e4d5379022c32bb08605c32a5e831f430bd0f6495b6  maya-calendar-android/project/app/src/main/assets/index.html" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: maya-calendar-android/project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk
          cp maya-calendar-android/project/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/MayaCalendar-v1.1.apk
          sha256sum /tmp/apk/MayaCalendar-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.1-APK
          path: /tmp/apk/MayaCalendar-v1.1.apk
          if-no-files-found: error
          retention-days: 30
