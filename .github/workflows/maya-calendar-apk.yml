name: Build Maya Calendar APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnose HTML chunks
        run: |
          sha256sum maya-calendar-android/index-parts/*.b64
          exit 1
