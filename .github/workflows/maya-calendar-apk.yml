name: Build Maya Calendar APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore HTML asset
        run: |
          mkdir -p maya-calendar-android/project/app/src/main/assets
          base64 -d maya-calendar-android/index.html.gz.b64 | gunzip > maya-calendar-android/project/app/src/main/assets/index.html
          test -s maya-calendar-android/project/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: maya-calendar-android/project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk
          cp maya-calendar-android/project/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/MayaCalendar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-APK
          path: /tmp/apk/MayaCalendar.apk
          if-no-files-found: error
          retention-days: 30
