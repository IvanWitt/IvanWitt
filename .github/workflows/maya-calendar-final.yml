name: Build Maya Calendar Final v1.2

on:
  pull_request:
    branches:
      - build-base-v12
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified final sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo='IvanWitt/IvanWitt'
          token=os.environ['GH_TOKEN']
          items={
            'maya-calendar-android/project/app/src/main/assets/index.html':'f47fdee9a1c807aa072eed42cc626e2a3e1f9642',
            'maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java':'d557d3e8c0939a232dfbdc780633957b56353b3c',
            'maya-calendar-android/project/app/src/main/res/drawable-nodpi/splash_maya.webp':'c708ab27e0731d47ab0ceb3b900404fc541f61e4',
          }
          for path,sha in items.items():
            url=f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req) as r: data=json.load(r)
            raw=base64.b64decode(data['content'])
            p=pathlib.Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(raw)
          PY
          echo 'afc86548df83e13f65e14fd37efb4a15a8ef73751ea9438d6211afc78279572c  maya-calendar-android/project/app/src/main/assets/index.html' | sha256sum -c -
          echo '90ca2a8458f2ef3bab4ab9bde6e2a6b1b8fad9d20464a91a5b45551acd1c7adb  maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java' | sha256sum -c -
          echo 'c40b642d0e4514a8a441515b2d7d8e45c6d708b8494c9806fecd8d1270d3126e  maya-calendar-android/project/app/src/main/res/drawable-nodpi/splash_maya.webp' | sha256sum -c -

      - name: Verify requested fixes
        run: |
          HTML=maya-calendar-android/project/app/src/main/assets/index.html
          JAVA=maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          ! grep -q 'iwitt.ru' "$HTML"
          ! grep -q 'Автономный HTML' "$HTML"
          ! grep -q 'window.applyImportedEventsJson' "$HTML"
          grep -q 'receiveImportedEventsJson' "$HTML"
          grep -q 'ACTION_OPEN_DOCUMENT' "$JAVA"
          grep -q 'setDecorFitsSystemWindows(true)' "$JAVA"
          grep -q 'Календарь Майя v1.2' "$JAVA"
          grep -q 'Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL' "$JAVA"

      - name: Set Android version
        run: |
          cat > maya-calendar-android/project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ru.ivwitt.mayacalendar'
              compileSdk 35
              defaultConfig {
                  applicationId 'ru.ivwitt.mayacalendar'
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName '1.2'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF
          grep -q 'targetSdk 34' maya-calendar-android/project/app/build.gradle
          grep -q "versionName '1.2'" maya-calendar-android/project/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: maya-calendar-android/project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=maya-calendar-android/project/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html | sha256sum | grep '^afc86548df83e13f65e14fd37efb4a15a8ef73751ea9438d6211afc78279572c'
          unzip -l "$APK" | grep 'splash_maya'
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/MayaCalendar-v1.2-final.apk
          sha256sum /tmp/apk/MayaCalendar-v1.2-final.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.2-final-APK
          path: /tmp/apk/MayaCalendar-v1.2-final.apk
          if-no-files-found: error
          retention-days: 30
