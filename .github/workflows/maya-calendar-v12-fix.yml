name: Build Maya Calendar v1.2 Fix

on:
  pull_request:
    branches:
      - build-base-v12
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore corrected sources
        run: |
          set -euo pipefail
          mkdir -p maya-calendar-android/project/app/src/main/assets
          cat maya-calendar-android/v12fix4/html/00.b64 maya-calendar-android/v12fix4/html/01.b64 maya-calendar-android/v12fix4/html/02.b64 maya-calendar-android/v12fix4/html/03.b64 maya-calendar-android/v12fix4/html/04.b64 | tr -d '\n\r ' | base64 -d | gunzip > maya-calendar-android/project/app/src/main/assets/index.html
          cat maya-calendar-android/v12fix4/java/00.b64 | tr -d '\n\r ' | base64 -d | gunzip > maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          cat maya-calendar-android/v12fix4/gradle/00.b64 | tr -d '\n\r ' | base64 -d | gunzip > maya-calendar-android/project/app/build.gradle
          echo 'afc86548df83e13f65e14fd37efb4a15a8ef73751ea9438d6211afc78279572c  maya-calendar-android/project/app/src/main/assets/index.html' | sha256sum -c -
          echo '90ca2a8458f2ef3bab4ab9bde6e2a6b1b8fad9d20464a91a5b45551acd1c7adb  maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java' | sha256sum -c -
          echo '75c7ef4d826856e64ea3ffdb5f8e29d6c62d6d40c047c6f705157a92f33125e7  maya-calendar-android/project/app/build.gradle' | sha256sum -c -

      - name: Restore sharp splash
        run: |
          set -euo pipefail
          rm -f maya-calendar-android/project/app/src/main/res/drawable/splash_maya.*
          mkdir -p maya-calendar-android/project/app/src/main/res/drawable-nodpi
          tr -d '\n\r ' < maya-calendar-android/v12/splash.jpg.b64 | base64 -d > maya-calendar-android/project/app/src/main/res/drawable-nodpi/splash_maya.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('maya-calendar-android/project/app/src/main/res/drawable-nodpi/splash_maya.jpg')
          b=p.read_bytes()
          i=2; w=h=None
          while i < len(b)-9:
              if b[i] != 0xFF: i += 1; continue
              marker=b[i+1]; i += 2
              if marker in (0xD8,0xD9): continue
              if i+2 > len(b): break
              n=int.from_bytes(b[i:i+2],'big')
              if marker in list(range(0xC0,0xC4))+list(range(0xC5,0xC8))+list(range(0xC9,0xCC))+list(range(0xCD,0xD0)):
                  h=int.from_bytes(b[i+3:i+5],'big'); w=int.from_bytes(b[i+5:i+7],'big'); break
              i += n
          print('splash dimensions:', w, h, 'bytes:', len(b))
          assert w and h and w >= 600 and h >= 1000, f'Splash too small: {w}x{h}'
          PY

      - name: Verify every requested fix
        run: |
          set -euo pipefail
          H=maya-calendar-android/project/app/src/main/assets/index.html
          J=maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          G=maya-calendar-android/project/app/build.gradle
          ! grep -q 'iwitt.ru' "$H"
          ! grep -q 'Автономный HTML-файл' "$H"
          ! grep -q 'window.applyImportedEventsJson' "$H"
          grep -q 'function importEventsJsonText' "$H"
          grep -q 'window.receiveImportedEventsJson' "$H"
          grep -q 'AndroidBridge.importJson' "$H"
          grep -q '<span>Версия</span><strong>1.2</strong>' "$H"
          grep -q 'Календарь Майя v1.2' "$J"
          grep -q 'ACTION_OPEN_DOCUMENT' "$J"
          grep -q 'receiveImportedEventsJson' "$J"
          grep -q 'setDecorFitsSystemWindows(true)' "$J"
          grep -q 'targetSdk 34' "$G"
          grep -q "versionName '1.2'" "$G"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('maya-calendar-android/project/app/src/main/assets/index.html').read_text()
          a=s.index('function importEventsJsonText')
          b=s.index('window.receiveImportedEventsJson', a)
          helper=s[a:b]
          assert helper.count('importEventsJsonText') == 1, 'recursive import helper detected'
          receiver=s[b:s.index('async function importEvents',b)]
          assert 'importEventsJsonText(text)' in receiver
          print('import recursion test: OK')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('maya-calendar-android/project/app/src/main/assets/index.html').read_text()
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: maya-calendar-android/project
        run: gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p /tmp/apk
          cp maya-calendar-android/project/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/MayaCalendar-v1.2-fixed.apk
          sha256sum /tmp/apk/MayaCalendar-v1.2-fixed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.2-fixed-APK
          path: /tmp/apk/MayaCalendar-v1.2-fixed.apk
          if-no-files-found: error
          retention-days: 30
