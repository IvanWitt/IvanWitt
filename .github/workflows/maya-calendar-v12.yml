name: Build Maya Calendar v1.2

on:
  pull_request:
    branches:
      - build-base-v12
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify final HTML
        run: |
          mkdir -p maya-calendar-android/project/app/src/main/assets
          cat maya-calendar-android/v12final/html/00.b64 maya-calendar-android/v12final/html/01.b64 maya-calendar-android/v12final/html/02.b64 maya-calendar-android/v12final/html/03.b64 maya-calendar-android/v12final/html/04.b64 maya-calendar-android/v12final/html/05.b64 maya-calendar-android/v12final/html/06a.b64 maya-calendar-android/v12final/html/06b.b64 maya-calendar-android/v12final/html/06c.b64 | tr -d '\n\r ' | base64 -d | gunzip > maya-calendar-android/project/app/src/main/assets/index.html
          echo "953262d456a6c31f426db4c1384056c62f3c93245044de207b95eeaf18a9ad24  maya-calendar-android/project/app/src/main/assets/index.html" | sha256sum -c -

      - name: Restore and verify final MainActivity
        run: |
          mkdir -p maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar
          cat maya-calendar-android/v12final/java/00a.b64 maya-calendar-android/v12final/java/00b.b64 maya-calendar-android/v12final/java/00c.b64 maya-calendar-android/v12final/java/00d.b64 maya-calendar-android/v12final/java/01.b64 | tr -d '\n\r ' | base64 -d | gunzip > maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          echo "45f707fa94468d34d1ab53e29e744a690d13161bd9ed37c3068128f40eeee5f0  maya-calendar-android/project/app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java" | sha256sum -c -

      - name: Set app version
        run: |
          cat > maya-calendar-android/project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ru.ivwitt.mayacalendar'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.ivwitt.mayacalendar'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Restore and verify splash image
        run: |
          mkdir -p maya-calendar-android/project/app/src/main/res/drawable
          tr -d '\n\r ' < maya-calendar-android/v12/splash_small.jpg.b64 | base64 -d > maya-calendar-android/project/app/src/main/res/drawable/splash_maya.jpg
          echo "6514758df55de2f963c5363ba6de633252a19ef24238a6faa2b1ea3563682ea8  maya-calendar-android/project/app/src/main/res/drawable/splash_maya.jpg" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: maya-calendar-android/project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk
          cp maya-calendar-android/project/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/MayaCalendar-v1.2.apk
          sha256sum /tmp/apk/MayaCalendar-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.2-APK
          path: /tmp/apk/MayaCalendar-v1.2.apk
          if-no-files-found: error
          retention-days: 30
