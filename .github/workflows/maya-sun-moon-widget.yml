name: Build Maya Sun Moon Widget

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/maya-sun-moon-widget
    paths:
      - 'Maya-Sun-Moon-Widget/**'
      - '.github/workflows/maya-sun-moon-widget.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Maya-Sun-Moon-Widget/**'
      - '.github/workflows/maya-sun-moon-widget.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare original PNG decoration assets
        run: |
          python3 -m venv /tmp/pngvenv
          /tmp/pngvenv/bin/pip install --quiet pillow
          /tmp/pngvenv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          drawable = Path('Maya-Sun-Moon-Widget/app/src/main/res/drawable')
          for stem in ('design_maya_night_original', 'design_jungle_temple'):
              src = drawable / f'{stem}.webp'
              dst = drawable / f'{stem}.png'
              if not src.exists():
                  raise SystemExit(f'Missing source decoration: {src}')
              with Image.open(src) as im:
                  rgba = im.convert('RGBA')
                  rgba.save(dst, format='PNG', optimize=True)
                  print(f'{stem}: {rgba.size} -> {dst}')
              src.unlink()
          PY

      - name: Build debug APK
        working-directory: Maya-Sun-Moon-Widget
        run: gradle --no-daemon assembleDebug

      - name: Verify decoration assets in APK
        run: |
          APK=Maya-Sun-Moon-Widget/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'design_(golden_temple|maya_night_original|jungle_temple)\.(png|webp)' | tee /tmp/design-assets.txt
          grep -q 'design_golden_temple.png' /tmp/design-assets.txt
          grep -q 'design_maya_night_original.png' /tmp/design-assets.txt
          grep -q 'design_jungle_temple.png' /tmp/design-assets.txt
          if grep -qE 'design_(maya_night|maya_flight|palms)\.(png|webp)' /tmp/design-assets.txt; then
            echo 'Unexpected obsolete decoration asset found'
            exit 1
          fi

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk
          cp Maya-Sun-Moon-Widget/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/Maya-Sun-Moon-Widget-debug.apk
          sha256sum /tmp/apk/Maya-Sun-Moon-Widget-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-Sun-Moon-Widget-APK
          path: /tmp/apk/Maya-Sun-Moon-Widget-debug.apk
          if-no-files-found: error
          retention-days: 30
