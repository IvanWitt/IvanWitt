name: Build Maya Sun Moon Widget

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/maya-sun-moon-widget
    paths:
      - 'Maya-Sun-Moon-Widget/**'
      - '.github/workflows/maya-sun-moon-widget.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Maya-Sun-Moon-Widget/**'
      - '.github/workflows/maya-sun-moon-widget.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: Maya-Sun-Moon-Widget
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p /tmp/apk
          cp Maya-Sun-Moon-Widget/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/Maya-Sun-Moon-Widget-debug.apk
          sha256sum /tmp/apk/Maya-Sun-Moon-Widget-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-Sun-Moon-Widget-APK
          path: /tmp/apk/Maya-Sun-Moon-Widget-debug.apk
          if-no-files-found: error
          retention-days: 30
