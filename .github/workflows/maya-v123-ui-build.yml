name: Build Maya Calendar UI v1.2.3

on:
  push:
    branches:
      - feature/maya-calendar-main-tzolkin-haab
  pull_request:
    branches:
      - maya-final-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maya-calendar-main-tzolkin-haab

      - name: Verify final sources
        run: |
          echo '3a271fe1a3e954492964cd45c9079f56d0597880c8683f1d9de773cf88fa3dc6  app/src/main/assets/index.html' | sha256sum -c -
          HTML=app/src/main/assets/index.html
          JAVA=app/src/main/java/ru/ivwitt/mayacalendar/MainActivity.java
          grep -q '>Главная<' "$HTML"
          grep -q 'На основании текущей даты рассчитываются Цолькин и Хааб' "$HTML"
          grep -q 'monthIndex+1' "$HTML"
          grep -q 'kinForToneAndSeal' "$HTML"
          grep -q 'tzolkinZoomButton' "$HTML"
          grep -q 'calendarDetailModal' "$HTML"
          grep -q 'haab-day' "$HTML"
          grep -q 'org.json.JSONObject.quote(json)' "$JAVA"
          grep -q 'public void importJson()' "$JAVA"
          ! grep -q 'n new String' "$JAVA"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text('utf-8')
          Path('/tmp/maya.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),'utf-8')
          PY
          node --check /tmp/maya.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and capture diagnostics
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > /tmp/gradle.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -n 120 /tmp/gradle.log > /tmp/gradle-tail.txt
          exit 0

      - name: Upload Gradle diagnostics
        if: steps.gradle_build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: MayaCalendar-v1.2.3-gradle-diagnostics
          path: /tmp/gradle-tail.txt

      - name: Fail if Gradle failed
        if: steps.gradle_build.outputs.exit_code != '0'
        run: |
          cat /tmp/gradle-tail.txt
          exit 1

      - name: Verify APK
        if: steps.gradle_build.outputs.exit_code == '0'
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          echo '3a271fe1a3e954492964cd45c9079f56d0597880c8683f1d9de773cf88fa3dc6  /tmp/apk-index.html' | sha256sum -c -
          mkdir -p /tmp/apk
          cp "$APK" /tmp/apk/MayaCalendar-v1.2.3-ui-debug.apk

      - uses: actions/upload-artifact@v4
        if: steps.gradle_build.outputs.exit_code == '0'
        with:
          name: MayaCalendar-v1.2.3-ui-debug
          path: /tmp/apk/MayaCalendar-v1.2.3-ui-debug.apk
          if-no-files-found: error
